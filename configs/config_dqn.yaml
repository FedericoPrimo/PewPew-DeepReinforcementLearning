dqn:
  learning_rate: 1.0e-4
  gamma: 0.99
  batch_size: 32
  replay_buffer_size: 100000
  target_update_freq: 1000   # hard update ogni N step
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay_steps: 500000
  learning_starts: 10000     # step prima di iniziare training
  train_freq: 4              # aggiorna ogni N step
  total_timesteps: 10000000

model:
  feature_dim: 512
  device: "cpu"              # "cpu" | "cuda" | "mps"
