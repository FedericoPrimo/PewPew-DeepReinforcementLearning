# Iperparametri dal paper originale PPO OpenAI su Atari (Schulman et al. 2017).
# n_envs=8 è necessario: rollout_buffer = n_envs * n_steps = 1024 > batch_size = 256.
ppo:
  n_envs: 8
  n_steps: 128
  n_epochs: 4
  batch_size: 256
  learning_rate: 2.5e-4
  lr_schedule: "linear"     # decrescente linearmente a 0
  clip_range: 0.1
  clip_range_vf: null       # null = value clipping disattivato
  normalize_advantage: true
  max_grad_norm: 0.5
  gamma: 0.99
  gae_lambda: 0.95
  ent_coef: 0.01
  vf_coef: 0.5
  total_timesteps: 10000000

model:
  device: "cpu"              # "cpu" | "cuda" | "mps"
  feature_dim: 512
